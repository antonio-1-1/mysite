<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="claude:viewport-fit-sides" content="cover">
    <title>Social Hub</title>
    <meta name="description" content="Hub centralisé de tous mes réseaux sociaux. Retrouvez-moi sur TikTok, Instagram, YouTube et plus.">
    <meta property="og:title" content="Social Hub">
    <meta property="og:description" content="Hub centralisé de tous mes réseaux sociaux">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Social Hub">
    <meta name="twitter:description" content="Hub centralisé de tous mes réseaux sociaux">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">

    <style>
        /* ========== DESIGN SYSTEM ========== */
        :root {
            --primary: #00d9ff;
            --primary-dark: #00a8cc;
            --accent: #ff006e;
            --accent-light: #ff1493;
            --bg-dark: #0a0e27;
            --bg-darker: #050812;
            --surface: #1a1f3a;
            --surface-light: #252d4a;
            --text-primary: #ffffff;
            --text-secondary: #b0b8d4;
            --text-tertiary: #7a8199;
            --success: #00d084;
            --warning: #ffb700;

            --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            color-scheme: dark;
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --primary: #0099cc;
                --primary-dark: #0077aa;
                --accent: #e91e63;
                --accent-light: #ff1493;
                --bg-dark: #f8fafc;
                --bg-darker: #ffffff;
                --surface: #f1f5f9;
                --surface-light: #e8ecf1;
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --text-tertiary: #94a3b8;
                --success: #10b981;
                --warning: #f59e0b;

                color-scheme: light;
            }
        }

        :root[data-theme="light"] {
            --primary: #0099cc;
            --primary-dark: #0077aa;
            --accent: #e91e63;
            --accent-light: #ff1493;
            --bg-dark: #f8fafc;
            --bg-darker: #ffffff;
            --surface: #f1f5f9;
            --surface-light: #e8ecf1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;

            color-scheme: light;
        }

        /* ========== RESET & GLOBALS ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            height: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-left: max(16px, env(safe-area-inset-left, 0px));
            padding-right: max(16px, env(safe-area-inset-right, 0px));
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 0, 110, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ========== TYPOGRAPHY ========== */
        h1, h2, h3, h4 {
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: -0.02em;
            text-wrap: balance;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.5rem;
            line-height: 1.2;
        }

        p {
            color: var(--text-secondary);
            max-width: 65ch;
        }

        /* ========== LAYOUT CONTAINER ========== */
        .container {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-block: max(2rem, 5vh);
            width: 100%;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.6s ease-out;
        }

        /* ========== PROFILE SECTION ========== */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
            animation: slideDown 0.8s ease-out;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.3), inset 0 0 30px rgba(255, 0, 110, 0.1);
            border: 2px solid var(--primary);
            animation: glow 3s ease-in-out infinite;
            position: relative;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 217, 255, 0.3), inset 0 0 30px rgba(255, 0, 110, 0.1); }
            50% { box-shadow: 0 0 50px rgba(0, 217, 255, 0.5), inset 0 0 30px rgba(255, 0, 110, 0.2); }
        }

        .profile-info h1 {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--primary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 60ch;
        }

        /* ========== SOCIAL LINKS GRID ========== */
        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            animation-delay: 0.2s;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem;
            background: var(--surface);
            border: 1px solid var(--surface-light);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            animation: slideUp 0.6s ease-out backwards;
        }

        .social-link:nth-child(1) { animation-delay: 0.3s; }
        .social-link:nth-child(2) { animation-delay: 0.35s; }
        .social-link:nth-child(3) { animation-delay: 0.4s; }
        .social-link:nth-child(4) { animation-delay: 0.45s; }
        .social-link:nth-child(5) { animation-delay: 0.5s; }
        .social-link:nth-child(6) { animation-delay: 0.55s; }
        .social-link:nth-child(7) { animation-delay: 0.6s; }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .social-link:hover::before {
            left: 100%;
        }

        .social-link:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2), 0 8px 24px rgba(0, 217, 255, 0.15);
        }

        .social-link.active:hover {
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3), 0 8px 24px rgba(0, 217, 255, 0.25);
        }

        .social-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .social-link-text {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .social-link-name {
            font-weight: 600;
        }

        .live-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--surface-light);
            color: var(--text-tertiary);
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            padding: 0;
        }

        .live-toggle-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 0, 110, 0.1);
        }

        .live-toggle-btn svg {
            width: 14px;
            height: 14px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.35rem 0.65rem;
            background: var(--accent);
            color: white;
            border-radius: 999px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            animation: pulse 2s ease-in-out infinite;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            50% { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0); }
        }

        /* ========== ACTIONS ========== */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            margin-top: 1rem;
            animation-delay: 0.8s;
        }

        .btn {
            padding: 0.875rem;
            border: none;
            border-radius: 10px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            text-decoration: none;
            text-wrap: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.4), 0 8px 16px rgba(0, 217, 255, 0.2);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 1.5px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--surface-light);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        /* ========== TOAST NOTIFICATION ========== */
        .toast {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            right: max(20px, env(safe-area-inset-right, 20px));
            padding: 1rem 1.5rem;
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--primary);
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 0 30px rgba(0, 217, 255, 0.2);
            animation: slideInUp 0.3s ease-out;
            z-index: 1000;
            pointer-events: auto;
        }

        .toast.hidden {
            display: none;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== FOOTER ========== */
        .footer {
            position: relative;
            z-index: 1;
            padding-block: 1.5rem;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            border-top: 1px solid var(--surface-light);
            margin-top: auto;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--text-primary);
        }

        /* ========== THEME TOGGLE ========== */
        .theme-toggle {
            position: fixed;
            top: max(16px, env(safe-area-inset-top, 16px));
            right: max(16px, env(safe-area-inset-right, 16px));
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--surface-light);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .theme-toggle:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* ========== LANGUAGE TOGGLE ========== */
        .lang-toggle-container {
            position: fixed;
            top: max(16px, env(safe-area-inset-top, 16px));
            right: max(72px, calc(env(safe-area-inset-right, 16px) + 60px));
            z-index: 99;
        }

        .lang-toggle {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--surface-light);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            font-family: var(--font-display);
        }

        .lang-toggle:hover {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }

        .language-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--surface);
            border: 1px solid var(--surface-light);
            border-radius: 10px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            animation: slideDown 0.2s ease-out;
            min-width: 80px;
        }

        .language-menu.hidden {
            display: none;
        }

        .lang-btn {
            padding: 0.5rem 0.75rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .lang-btn:hover {
            background: var(--surface-light);
            color: var(--text-primary);
        }

        .lang-btn.active {
            background: var(--primary);
            color: var(--bg-dark);
            font-weight: 700;
        }

        /* ========== ADMIN BUTTON ========== */
        .admin-btn {
            position: fixed;
            top: max(16px, env(safe-area-inset-top, 16px));
            left: max(16px, env(safe-area-inset-left, 16px));
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: 1px solid var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.65rem;
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            z-index: 101;
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }

        .admin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 110, 0.5);
        }

        .admin-btn.hidden {
            display: none;
        }

        /* ========== ANIMATIONS ========== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.75rem;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }

            .social-link {
                padding: 1rem;
                font-size: 0.9rem;
            }

            .container {
                padding-block: max(1.5rem, 3vh);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div class="lang-toggle-container">
        <button class="lang-toggle" id="langToggle" aria-label="Change language">
            EN
        </button>
        <div class="language-menu hidden" id="languageMenu">
            <!-- Language buttons will be generated by app.js -->
        </div>
    </div>

    <button class="admin-btn hidden" id="adminBtn" aria-label="Disable admin mode" title="Click to exit admin mode">
        ADMIN
    </button>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light theme">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Moon icon (shown in dark mode) -->
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="container">
        <div class="content">
            <!-- PROFILE SECTION -->
            <div class="profile">
                <div class="avatar" id="avatar">
                    🎮
                </div>
                <div class="profile-info">
                    <div class="tagline" id="tagline">Content Creator</div>
                    <h1 id="pseudo">YourPseudo</h1>
                    <p class="bio" id="bio">Streamer gaming & content créateur.\nRejoint ma communauté pour des lives quotidiens et du contenu exclusif.</p>
                </div>
            </div>

            <!-- SOCIAL LINKS -->
            <div class="social-grid" id="socialGrid">
                <!-- Les liens seront générés par JavaScript -->
            </div>

            <!-- ACTION BUTTONS -->
            <div class="actions">
                <button class="btn btn-primary" id="shareBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                    <span id="shareBtnText">Partager ce site</span>
                </button>
            </div>
        </div>
    </div>

    <footer class="footer" id="footer">
        <p>&copy; <span id="year">2024</span> YourPseudo • Tous droits réservés</p>
    </footer>

    <div class="toast hidden" id="toast"></div>

    <!-- External Scripts -->
    <script src="config.js" defer></script>
    <script src="i18n.js" defer></script>
    <script src="icons.js" defer></script>
    <script src="app.js" defer></script>
</body>
</html>
